# Education standards, frameworks and primary-source collections.
#
# Almost nothing here is openly licensed, and that is the point of recording it. The public-domain
# core is the federal and national-collection material — Head Start, the Library of Congress, the
# National Archives. Common Core is usable only with its required attribution notice. Everything
# else is copyrighted and free to read.
#
# For anyone generating learning material the consequence is specific: align to a standard and cite
# its code, and write your own objective in your own words beside it. A paraphrase close enough to
# be useful is close enough to be a derivative.
#
# Reachability note. Several publishers here — thecorestandards.org, eclkc.ohs.acf.hhs.gov, loc.gov,
# naeyc.org — refuse automated requests from some networks with a 403. That is a bot filter rather
# than a dead link, and `check-sources.py --online` reports it as a warning for exactly that reason.
# The weekly workflow runs from a different network and is the real verification. Where a specific
# page could not be confirmed, the entry points at the publisher's canonical landing page rather
# than at a deep link nobody has fetched.

