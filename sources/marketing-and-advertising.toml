# Advertising regulation, messaging law, and the platform documentation that decides whether a
# tactic is sanctionable.
#
# The pattern worth noticing: almost nothing here settles how to market well. What it settles is
# where the boundary is — what you may claim, how you must disclose it, whom you may contact, and
# what will get a page or a listing penalized. Craft skills in this department deliberately carry no
# sources, because no authority decides how to write a good line and a source pretending otherwise
# would lend false weight.

