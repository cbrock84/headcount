# AI governance, data specifications, statistical method, and the employment rules that constrain
# how people are hired, classified and paid.
#
# One finding from the research is worth carrying: a federal agency's technical assistance document
# on AI in hiring — widely cited — was withdrawn from its own site. A skill citing it would send an
# agent to a dead link. The durable substitute is the regulation underneath it, which is far harder
# to withdraw than a guidance page. That is a general lesson for this catalog: prefer the rule to
# the explainer, because the explainer is what disappears.

