url = "https://www.gao.gov/products/gao-20-195g"
license = "public-domain-usgov"
jurisdiction = "US"
authoritative_for = "What makes a cost estimate defensible, and specifically how much contingency is justified — via risk and uncertainty analysis at a stated confidence level, rather than a percentage somebody remembers."
data = "https://www.gao.gov/assets/gao-20-195g.pdf"
skills = ["pmo:estimating-and-contingency", "pmo:portfolio-governance", "pmo:program-management"]
checked = "2026-09-16"

