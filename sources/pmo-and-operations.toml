# Delivery assurance, procurement, safety and the regulators who arrive at a site.
#
# The best material here is unexpected: the US Government Accountability Office publishes the most
# rigorous free guidance anywhere on whether a schedule is reliable and whether a cost estimate is
# defensible, and it is public domain. The commercial project-management bodies of knowledge are
# sold, and — for the questions this catalog cares about, like how much contingency is justified or
# what float threshold matters — they settle less than the GAO guides do.

[[source]]
id = "gao-schedule-assessment"
title = "GAO Schedule Assessment Guide: best practices for project schedules"
publisher = "US Government Accountability Office"
url = "https://www.gao.gov/products/gao-16-89g"
license = "public-domain-usgov"
jurisdiction = "US"
authoritative_for = "Whether a schedule is reliable — the ten criteria an auditor applies, covering the work breakdown, sequencing, resource loading, critical path, total float and schedule risk analysis."
data = "https://www.gao.gov/assets/gao-16-89g.pdf"
skills = ["pmo:schedule-development-and-analysis", "pmo:project-delivery", "pmo:dependency-and-risk-management"]
checked = "2026-09-16"

