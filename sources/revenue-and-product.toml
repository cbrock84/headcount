# Accessibility, selling law, contract mechanics and the platform rules that decide whether a
# pricing flow ships.
#
# Two negative findings shaped this file and are worth stating plainly, because the obvious
# candidates fail. There is no free normative definition of the common revenue metrics — annual
# recurring revenue, net retention, customer acquisition cost — and the best-known satisfaction
# metric is a trademark whose method belongs to its owner. What authority exists applies at the
# disclosure boundary: if you publish a metric, you must define it and calculate it consistently.
# Anything claiming to define the metric itself is a vendor, and the skills say so.

