# Protocol specifications, hardening baselines and platform reference architectures.
#
# This is the department where the "does an authority settle it" test does the most work. Protocol
# and format questions have exact answers published by the body that defines them. Practice
# questions — how to review code, how to debug, when a thing is done — have none, and the skills
# that cover them deliberately carry no sources. A blog post with a confident tone is not an
# authority, and this area has more of those than any other.

# ── Interfaces and protocols ──────────────────────────────────────────────────

